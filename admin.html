<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaphor — Дашборд управления</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #f59e0b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }

        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 8px;
            outline: none;
        }

        .btn {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .dashboard { display: none; max-width: 1100px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-card .title { font-size: 0.85rem; color: var(--muted); }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: var(--accent); margin-top: 5px; }

        .section-box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .section-box h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--accent); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--muted); }

        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="authBox" class="auth-container">
        <h2>Управленческая панель</h2>
        <p style="color: var(--muted); font-size: 0.9rem; margin-top: 5px;">Введите ключ доступа</p>
        <input type="password" id="passInput" placeholder="Пароль администратора">
        <button class="btn" id="loginBtn">Войти</button>
        <div id="errorBox" class="error-msg"></div>
    </div>

    <!-- Дашборд -->
    <div id="dashBox" class="dashboard">
        <header>
            <h2>📊 METAPHOR Analytics</h2>
            <button class="btn" id="logoutBtn" style="width: auto; padding: 8px 16px; background: var(--border); color: #fff;">Выйти</button>
        </header>

        <!-- Метрики -->
        <div class="grid">
            <div class="stat-card">
                <div class="title">Всего визитов</div>
                <div class="value" id="valVisits">0</div>
            </div>
            <div class="stat-card">
                <div class="title">Сгенерировано текстов</div>
                <div class="value" id="valGenerations">0</div>
            </div>
            <div class="stat-card">
                <div class="title">Скачиваний открыток</div>
                <div class="value" id="valDownloads">0</div>
            </div>
            <div class="stat-card">
                <div class="title">Всего отзывов</div>
                <div class="value" id="valFeedback">0</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Девайсы -->
            <div class="section-box">
                <h3>Устройства</h3>
                <ul id="deviceList" style="list-style: none;"></ul>
            </div>

            <!-- Страны -->
            <div class="section-box">
                <h3>География (Страны)</h3>
                <ul id="countryList" style="list-style: none;"></ul>
            </div>
        </div>

        <!-- Таблица отзывов -->
        <div class="section-box">
            <h3>Отзывы пользователей</h3>
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Оценка</th>
                        <th>Комментарий</th>
                        <th>Контакты</th>
                    </tr>
                </thead>
                <tbody id="feedbackTable">
                    <tr><td colspan="4" style="color: var(--muted);">Отзывов пока нет</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const authBox = document.getElementById('authBox');
        const dashBox = document.getElementById('dashBox');
        const loginBtn = document.getElementById('loginBtn');
        const passInput = document.getElementById('passInput');
        const errorBox = document.getElementById('errorBox');

        async function loadDashboard(password) {
            try {
                const res = await fetch('/api/admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (res.ok) {
                    sessionStorage.setItem('admin_pass', password);
                    authBox.style.display = 'none';
                    dashBox.style.display = 'block';

                    // Заполнение метрик
                    document.getElementById('valVisits').innerText = data.summary.totalVisits;
                    document.getElementById('valGenerations').innerText = data.summary.generations;
                    document.getElementById('valDownloads').innerText = data.summary.downloads;
                    document.getElementById('valFeedback').innerText = data.summary.totalFeedback;

                    // Устройства
                    const devList = document.getElementById('deviceList');
                    devList.innerHTML = Object.entries(data.devices)
                        .map(([k, v]) => `<li style="padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;"><span>${k.toUpperCase()}</span> <b>${v}</b></li>`)
                        .join('') || 'Нет данных';

                    // Страны
                    const countryList = document.getElementById('countryList');
                    countryList.innerHTML = Object.entries(data.countries)
                        .map(([k, v]) => `<li style="padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;"><span>${k}</span> <b>${v}</b></li>`)
                        .join('') || 'Нет данных';

                    // Таблица отзывов
                    if (data.feedbackList.length > 0) {
                        document.getElementById('feedbackTable').innerHTML = data.feedbackList.map(item => `
                            <tr>
                                <td>${new Date(item.created_at).toLocaleDateString()}</td>
                                <td>⭐ ${item.rating}</td>
                                <td>${item.comment || '-'}</td>
                                <td>${item.contact || '-'}</td>
                            </tr>
                        `).join('');
                    }
                } else {
                    errorBox.innerText = data.error || 'Ошибка доступа';
                }
            } catch (e) {
                errorBox.innerText = 'Ошибка соединения';
            }
        }

        loginBtn.addEventListener('click', () => {
            loadDashboard(passInput.value);
        });

        // Проверка сохраненной сессии
        const savedPass = sessionStorage.getItem('admin_pass');
        if (savedPass) {
            loadDashboard(savedPass);
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('admin_pass');
            location.reload();
        });
    </script>
</body>
</html>
