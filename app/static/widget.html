<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metaphor Widget</title><link rel="stylesheet" href="/static/styles.css"></head>
<body style="background:#111217"><main class="shell" style="width:min(680px,calc(100% - 20px));padding:10px 0"><section class="panel" style="border-radius:18px"><div class="topbar" style="padding:0 0 14px"><span class="brand">Metaphor</span><select id="wlang"><option value="ru">RU</option><option value="uz">UZ</option><option value="en">EN</option></select></div><form id="wform"><label>Для кого?<select name="relationship"><option value="partner">Близкий человек</option><option value="friend">Друг</option><option value="parent">Старший/родитель</option><option value="colleague">Коллега</option><option value="other">Другой человек</option></select></label><label class="full">Повод и одна личная деталь<textarea name="context" rows="4" required placeholder="Например: день рождения, вместе работали над сложным проектом"></textarea></label><label class="full">Тон<select name="tone"><option value="warm">Тёплый</option><option value="formal">Уважительный</option><option value="light">Лёгкий</option><option value="romantic">Романтичный</option></select></label><label class="consent"><input type="checkbox" required name="terms"> Не ввожу лишние персональные данные</label><button class="primary">Создать текст карточки</button></form><div id="wresult" class="result hidden"><div id="wtext" class="variant" contenteditable="true"></div><div class="actions"><button id="wcopy">Скопировать</button></div></div></section></main><script src="/static/widget.js"></script></body></html>
