<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Оператор — Metaphor</title><link rel="stylesheet" href="/static/styles.css">
</head>
<body><main class="shell">
<header class="topbar"><a class="brand" href="/">Metaphor / Operator</a></header>
<section class="panel">
  <h1 style="font-size:42px">Контур управления</h1>
  <div class="grid two">
    <label>Admin API key<input id="key" type="password" style="background:#121319;color:#fff;border:1px solid #343640;border-radius:14px;padding:13px"></label>
    <div style="align-self:end"><button id="connect" class="primary">Подключиться</button></div>
  </div>
  <p class="fine">Ключ хранится только в localStorage этого браузера. Перед production замените значение по умолчанию.</p>
</section>
<section id="dashboard" class="panel result hidden"><h2>7 дней</h2><div id="metrics" class="grid three"></div><div class="actions"><button id="run">Запустить контентный цикл</button><button id="refresh">Обновить</button></div></section>
<section id="queue" class="panel result hidden"><h2>Контентная очередь</h2><div id="items"></div></section>
</main><script src="/static/operator.js"></script></body></html>
