<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAPHOR — Искренние слова</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --input-bg: #1c273e;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #273552;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 100%;
            max-width: 580px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .lang-select {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.88rem;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .row-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 480px) {
            .row-two { grid-template-columns: 1fr; }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 14px;
            border-radius: var(--radius);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        button.btn-submit {
            background: var(--accent);
            color: #090d16;
            font-weight: 700;
            border: none;
            padding: 16px;
            border-radius: var(--radius);
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        button.btn-submit:hover {
            background: var(--accent-hover);
        }

        button.btn-submit:active {
            transform: scale(0.99);
        }

        /* Вывод результата */
        .result-box {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .result-content {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 18px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-act {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-act:hover {
            border-color: var(--accent);
            background: var(--input-bg);
        }

        .status-text {
            color: #ef4444;
            font-size: 0.88rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <header>
            <div class="logo">METAPHOR</div>
            <select id="langSelect" class="lang-select">
                <option value="ru">Русский</option>
                <option value="uz">O'zbekcha</option>
                <option value="en">English</option>
            </select>
        </header>

        <main class="form-grid">
            <!-- Логический блок 1: От кого / Кому -->
            <div class="row-two">
                <div class="field-group">
                    <label for="senderSelect">От кого</label>
                    <select id="senderSelect">
                        <option value="Отец">Отец</option>
                        <option value="Мать">Мать</option>
                        <option value="Муж">Муж</option>
                        <option value="Жена">Жена</option>
                        <option value="Друг">Друг</option>
                        <option value="Подруга">Подруга</option>
                        <option value="Брат">Брат</option>
                        <option value="Сестра">Сестра</option>
                        <option value="Коллега">Коллега</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="recipientSelect">Кому</label>
                    <select id="recipientSelect">
                        <!-- Динамически заполняется через JS -->
                    </select>
                </div>
            </div>

            <!-- Логический блок 2: Ситуация -->
            <div class="field-group">
                <label for="eventInput">Ситуация / Повод</label>
                <input type="text" id="eventInput" placeholder="Например: День рождения, поддержка перед экзаменом...">
            </div>

            <!-- Логический блок 3: Тональность -->
            <div class="field-group">
                <label for="toneSelect">Тон / Тональность</label>
                <select id="toneSelect">
                    <option value="Искренний и теплый">Искренний и теплый</option>
                    <option value="Восточная классика">Восточная классика</option>
                    <option value="Западная драма">Западная драма</option>
                    <option value="Современный эпос">Современный эпос</option>
                    <option value="Легкий и с юмором">Легкий и с юмором</option>
                </select>
            </div>

            <button id="generateBtn" class="btn-submit">Сгенерировать текст</button>
            <div id="statusText" class="status-text"></div>

            <!-- Блок результатов -->
            <div id="resultBox" class="result-box">
                <div id="resultText" class="result-content"></div>
                <div class="action-grid">
                    <button id="copyBtn" class="btn-act">📋 Копировать</button>
                    <button id="speechBtn" class="btn-act">🔊 Озвучить</button>
                    <button id="downloadBtn" class="btn-act">🎨 Скачать карту</button>
                    <button id="telegramBtn" class="btn-act">✈️ В Telegram</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Логика допустимых связей (Кто -> Кому)
        const recipientRules = {
            'Отец': ['Сын', 'Дочь'],
            'Мать': ['Сын', 'Дочь'],
            'Муж': ['Жена'],
            'Жена': ['Муж'],
            'Друг': ['Друг', 'Подруга'],
            'Подруга': ['Друг', 'Подруга'],
            'Брат': ['Брат', 'Сестра'],
            'Сестра': ['Брат', 'Сестра'],
            'Коллега': ['Коллега', 'Команда', 'Руководитель']
        };

        const senderSelect = document.getElementById('senderSelect');
        const recipientSelect = document.getElementById('recipientSelect');
        const eventInput = document.getElementById('eventInput');
        const toneSelect = document.getElementById('toneSelect');
        const langSelect = document.getElementById('langSelect');

        const generateBtn = document.getElementById('generateBtn');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const statusText = document.getElementById('statusText');

        // Аналитика
        async function trackEvent(data) {
            try {
                await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (e) {}
        }

        // Обновление списка «Кому» в зависимости от «От кого»
        function updateRecipients() {
            const sender = senderSelect.value;
            const allowed = recipientRules[sender] || ['Друг', 'Коллега'];

            recipientSelect.innerHTML = allowed.map(item => `<option value="${item}">${item}</option>`).join('');
        }

        senderSelect.addEventListener('change', updateRecipients);
        updateRecipients(); // инициализация

        // Инициализация языка
        const savedLang = localStorage.getItem('app_lang') || 'ru';
        langSelect.value = savedLang;
        trackEvent({ type: 'visit', language: savedLang });

        langSelect.addEventListener('change', (e) => {
            localStorage.setItem('app_lang', e.target.value);
        });

        // Генерация
        generateBtn.addEventListener('click', async () => {
            const sender = senderSelect.value;
            const recipient = recipientSelect.value;
            const eventVal = eventInput.value.trim();
            const tone = toneSelect.value;
            const lang = langSelect.value;

            if (!eventVal) {
                alert('Укажите повод или ситуацию!');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerText = 'Создаем текст...';
            statusText.style.display = 'none';

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        step1: `От ${sender.toLowerCase()} к ${recipient.toLowerCase()}`,
                        step2: eventVal,
                        step3: tone,
                        lang: lang
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    resultText.innerText = data.text;
                    resultBox.style.display = 'block';
                    trackEvent({ type: 'event', eventName: 'generation_success', language: lang, tone });
                } else {
                    statusText.innerText = data.text || 'Ошибка генерации.';
                    statusText.style.display = 'block';
                }
            } catch (e) {
                statusText.innerText = 'Ошибка соединения с сервером.';
                statusText.style.display = 'block';
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = 'Сгенерировать текст';
            }
        });

        // Кнопки действий
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(resultText.innerText);
            alert('Скопировано!');
            trackEvent({ type: 'event', eventName: 'copy_text' });
        });

        document.getElementById('speechBtn').addEventListener('click', () => {
            if (!('speechSynthesis' in window)) return alert('Озвучка не поддерживается браузером.');
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(resultText.innerText);
            utt.lang = langSelect.value === 'uz' ? 'uz-UZ' : (langSelect.value === 'en' ? 'en-US' : 'ru-RU');
            window.speechSynthesis.speak(utt);
            trackEvent({ type: 'event', eventName: 'listen' });
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            // Генерация Canvas
            const cvs = document.createElement('canvas');
            cvs.width = 1000; cvs.height = 1000;
            const ctx = cvs.getContext('2d');
            
            ctx.fillStyle = '#131b2e'; ctx.fillRect(0,0,1000,1000);
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 8; ctx.strokeRect(40,40,920,920);
            
            ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 38px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('METAPHOR', 500, 120);

            ctx.fillStyle = '#ffffff'; ctx.font = '28px sans-serif';
            const words = resultText.innerText.split(' ');
            let line = '', lines = [];
            for (let w of words) {
                let test = line + w + ' ';
                if (ctx.measureText(test).width > 800) { lines.push(line); line = w + ' '; }
                else line = test;
            }
            lines.push(line);

            let y = 500 - (lines.length * 20);
            lines.forEach((l, i) => ctx.fillText(l, 500, y + (i * 45)));

            const a = document.createElement('a');
            a.download = 'metaphor-card.png';
            a.href = cvs.toDataURL();
            a.click();
            trackEvent({ type: 'event', eventName: 'download_card' });
        });

        document.getElementById('telegramBtn').addEventListener('click', () => {
            window.open(`https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(resultText.innerText)}`, '_blank');
            trackEvent({ type: 'event', eventName: 'telegram_share' });
        });
    </script>
</body>
</html>
