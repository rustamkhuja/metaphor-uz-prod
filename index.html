<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaphor — Искренние и точные слова</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .lang-select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        button.btn-primary {
            background: var(--accent-color);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button.btn-primary:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            position: relative;
        }

        .result-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: var(--border-color);
        }

        .status-msg {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">METAPHOR</div>
        <select id="langSelect" class="lang-select">
            <option value="ru">Русский</option>
            <option value="uz">O'zbekcha</option>
            <option value="en">English</option>
        </select>
    </header>

    <main>
        <div class="form-group">
            <label for="step1">От кого и кому:</label>
            <input type="text" id="step1" placeholder="Например: От друга другу, от сына маме">
        </div>

        <div class="form-group">
            <label for="step2">Ситуация / Повод:</label>
            <input type="text" id="step2" placeholder="Например: День рождения, поддержка в трудную минуту">
        </div>

        <div class="form-group">
            <label for="step3">Тон / Тональность:</label>
            <select id="step3">
                <option value="Искренний и теплый">Искренний и теплый</option>
                <option value="Восточная классика">Восточная классика</option>
                <option value="Западная драма">Западная драма</option>
                <option value="Современный эпос">Современный эпос</option>
                <option value="Легкий и с юмором">Легкий и с юмором</option>
            </select>
        </div>

        <button id="generateBtn" class="btn-primary">Сгенерировать текст</button>
        <div id="statusMsg" class="status-msg"></div>

        <div id="resultCard" class="result-card">
            <div id="resultText" class="result-text"></div>
            
            <div class="action-buttons">
                <button id="copyBtn" class="btn-action">📋 Копировать</button>
                <button id="listenBtn" class="btn-action">🔊 Озвучить</button>
                <button id="downloadBtn" class="btn-action">🎨 Download Card</button>
                <button id="shareTelegramBtn" class="btn-action">✈️ В Telegram</button>
            </div>
        </div>
    </main>

    <script>
        // Универсальная функция отправки аналитики
        async function trackEvent(payload) {
            try {
                await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error('Analytics tracking error:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const langSelect = document.getElementById('langSelect');
            const generateBtn = document.getElementById('generateBtn');
            const resultCard = document.getElementById('resultCard');
            const resultText = document.getElementById('resultText');
            const statusMsg = document.getElementById('statusMsg');

            const copyBtn = document.getElementById('copyBtn');
            const listenBtn = document.getElementById('listenBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const shareTelegramBtn = document.getElementById('shareTelegramBtn');

            // Восстановление языка из localStorage
            const savedLang = localStorage.getItem('selectedLanguage') || 'ru';
            langSelect.value = savedLang;

            // 1. Фиксируем визит
            trackEvent({
                type: 'visit',
                language: savedLang
            });

            // Смена языка
            langSelect.addEventListener('change', (e) => {
                localStorage.setItem('selectedLanguage', e.target.value);
            });

            // Генерация текста
            generateBtn.addEventListener('click', async () => {
                const step1 = document.getElementById('step1').value.trim();
                const step2 = document.getElementById('step2').value.trim();
                const step3 = document.getElementById('step3').value;
                const lang = langSelect.value;

                if (!step1 || !step2) {
                    alert('Пожалуйста, заполните поля ситуаций и получателя.');
                    return;
                }

                generateBtn.disabled = true;
                generateBtn.innerText = 'Генерируем...';
                statusMsg.style.display = 'none';

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ step1, step2, step3, lang })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        resultText.innerText = data.text;
                        resultCard.style.display = 'block';

                        // Трекинг успешной генерации
                        trackEvent({
                            type: 'event',
                            eventName: 'generation_success',
                            language: lang,
                            tone: step3
                        });
                    } else {
                        statusMsg.innerText = data.text || 'Ошибка при генерации.';
                        statusMsg.style.display = 'block';
                    }
                } catch (err) {
                    statusMsg.innerText = 'Слова потерялись в пути. Проверьте соединение.';
                    statusMsg.style.display = 'block';
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.innerText = 'Сгенерировать текст';
                }
            });

            // Кнопка: Копировать
            copyBtn.addEventListener('click', () => {
                const text = resultText.innerText;
                navigator.clipboard.writeText(text).then(() => {
                    alert('Текст скопирован в буфер обмена!');
                    trackEvent({
                        type: 'event',
                        eventName: 'copy_text',
                        language: langSelect.value,
                        tone: document.getElementById('step3').value
                    });
                });
            });

            // Кнопка: Озвучить
            listenBtn.addEventListener('click', () => {
                const text = resultText.innerText;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // сброс предыдущей речи
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = langSelect.value === 'uz' ? 'uz-UZ' : (langSelect.value === 'en' ? 'en-US' : 'ru-RU');
                    window.speechSynthesis.speak(utterance);

                    trackEvent({
                        type: 'event',
                        eventName: 'listen',
                        language: langSelect.value,
                        tone: document.getElementById('step3').value
                    });
                } else {
                    alert('Ваш браузер не поддерживает озвучку текста.');
                }
            });

            // Кнопка: Download Card
            downloadBtn.addEventListener('click', () => {
                alert('Функция генерации картинки-открытки подготавливается!');
                trackEvent({
                    type: 'event',
                    eventName: 'download_card_click',
                    language: langSelect.value,
                    tone: document.getElementById('step3').value
                });
            });

            // Кнопка: В Telegram
            shareTelegramBtn.addEventListener('click', () => {
                const text = encodeURIComponent(resultText.innerText);
                window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${text}`, '_blank');

                trackEvent({
                    type: 'event',
                    eventName: 'telegram_share',
                    language: langSelect.value,
                    tone: document.getElementById('step3').value
                });
            });
        });
    </script>
</body>
</html>
